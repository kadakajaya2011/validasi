<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layar Pelayanan Desa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#071827;color:#fff;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.screen{width:100%;height:100%;display:flex;flex-direction:column}.top{height:18%;display:flex;align-items:center;gap:22px;padding:18px 34px;background:#0c2740;border-bottom:4px solid #e5b93f}.logo{width:82px;height:82px;object-fit:contain;background:#fff;border-radius:12px;padding:5px;display:none}.village{font-size:clamp(26px,3vw,48px);font-weight:800}.sub{font-size:clamp(16px,1.5vw,26px);opacity:.8;margin-top:6px}.main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.card{width:min(1100px,90vw);padding:36px 42px;border-radius:28px;background:#103452;box-shadow:0 18px 60px #0007}.label{font-size:clamp(18px,2vw,30px);letter-spacing:2px;text-transform:uppercase;opacity:.8}.name{font-size:clamp(38px,6vw,88px);font-weight:900;margin:16px 0 18px;line-height:1.05}.service{font-size:clamp(24px,3vw,46px);font-weight:700}.purpose{font-size:clamp(18px,2vw,28px);margin-top:14px;opacity:.85}.bottom{height:15%;display:flex;align-items:center;justify-content:space-between;padding:20px 34px;background:#0c2740;font-size:clamp(16px,1.5vw,25px)}.clock{font-weight:800}.empty .card{background:transparent;box-shadow:none}.empty .name{font-size:clamp(34px,5vw,70px)}.hint{opacity:.78;font-size:clamp(18px,2vw,28px);margin-top:18px}.fade{animation:fade .35s ease}@keyframes fade{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="top"><img id="logo" class="logo"><div><div class="village" id="village">PELAYANAN DESA</div><div class="sub">INFORMASI PELAYANAN</div></div></div>
  <div class="main"><div class="card" id="card"><div class="label" id="label">PELAYANAN SEDANG BERLANGSUNG</div><div class="name" id="name">Selamat Datang</div><div class="service" id="service">Silakan menunggu pelayanan Anda</div><div class="purpose" id="purpose"></div><div class="hint" id="hint">Petugas akan memanggil Anda melalui layar ini.</div></div></div>
  <div class="bottom"><div id="date"></div><div class="clock" id="clock"></div></div>
</div>
<script>
const KEY='DESA_SERVICE_DISPLAY_STATE';
const $=id=>document.getElementById(id);
function clean(v){return String(v??'').trim()}
function titleCaseVillage(v){return clean(v).replace(/^(desa|kelurahan)\s+/i,'').trim()}
function showState(p){
  p=p||{};
  const desa=titleCaseVillage(p.village)||'DESA';
  $('village').textContent='PELAYANAN DESA '+desa.toUpperCase();
  if(p.logo){$('logo').src=p.logo;$('logo').style.display='block'}
  $('name').textContent=clean(p.name)||'Silakan menunggu';
  $('service').textContent=clean(p.service)||'Pelayanan Desa';
  $('purpose').textContent=clean(p.purpose)?'Keperluan: '+clean(p.purpose):'';
  $('hint').textContent=clean(p.number)?'Nomor Surat: '+clean(p.number):'Silakan menunggu pelayanan Anda.';
  $('card').classList.remove('fade');void $('card').offsetWidth;$('card').classList.add('fade');
}
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p)showState(p)}catch(e){}}
function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
load();clock();setInterval(clock,1000);
try{const bc=new BroadcastChannel('DESA_SERVICE_DISPLAY');bc.onmessage=e=>{if(e.data?.type==='SHOW_SERVICE')showState(e.data.payload)}}catch(e){}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{showState(JSON.parse(e.newValue))}catch(err){}}});
</script>
</body></html>
