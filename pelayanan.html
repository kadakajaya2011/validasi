<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layar Pelayanan Desa</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#10233b;--mute:#5d7188;--line:#d9e2ec;--accent:#1f5d91;--accent2:#e8f1fa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.screen{width:100%;height:100%;display:flex;flex-direction:column;background:var(--card)}
.sec{padding:0 4vw;border-bottom:1px solid var(--line)}

/* 1. HEADER */
.top{height:16%;display:flex;align-items:center;gap:2vw}
.logo{height:70%;aspect-ratio:1;object-fit:contain;display:none}
.village{font-size:clamp(22px,3vw,52px);font-weight:800;letter-spacing:1px}
.sub{font-size:clamp(14px,1.6vw,28px);color:var(--mute);margin-top:.4vh;letter-spacing:2px}

/* 2. NOMOR ANTRIAN */
.call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--accent2)}
.lbl{font-size:clamp(16px,2.2vw,38px);letter-spacing:4px;color:var(--mute);font-weight:700}
.queue{font-size:clamp(70px,15vw,260px);font-weight:900;line-height:1;margin:1vh 0;color:var(--accent)}
.queue.name{font-size:clamp(40px,7vw,120px);padding:0 2vw}
.go{font-size:clamp(20px,2.6vw,46px);letter-spacing:3px;font-weight:700;margin-top:1vh}
.loket{font-size:clamp(34px,5vw,90px);font-weight:900;margin-top:.5vh}

/* 3. DETAIL */
.detail{padding-top:1.6vh;padding-bottom:1.6vh;display:grid;grid-template-columns:max-content 1fr;gap:.7vh 2vw;font-size:clamp(16px,2vw,34px)}
.detail .k{font-weight:700;color:var(--mute);letter-spacing:1px}
.detail .v{font-weight:700}

/* 4. INFORMASI */
.info{padding-top:1.6vh;padding-bottom:1.6vh;font-size:clamp(15px,1.7vw,29px)}
.info .h{font-weight:800;letter-spacing:2px;color:var(--mute);margin-bottom:.5vh}

/* 5. FOOTER */
.bottom{height:11%;display:flex;align-items:center;justify-content:space-between;border-bottom:0;font-size:clamp(15px,1.7vw,29px);color:var(--mute);background:#f7fafd}
.clock{font-weight:800;font-size:clamp(22px,3vw,52px);color:var(--ink)}
.hours{display:flex;gap:3vw;flex-wrap:wrap}


/* ===== MODE CEK SURAT ===== */
#queueView,#letterView{width:100%;height:100%;display:flex;flex-direction:column}
#letterView{display:none;background:#cfd8e3}
.screen.letter #queueView{display:none}
.screen.letter #letterView{display:flex}
.lbar{display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:1.2vh 3vw;background:#fff;border-bottom:1px solid var(--line)}
.lbar .t{font-size:clamp(18px,2.4vw,42px);font-weight:900;color:var(--accent);letter-spacing:1px}
.lbar .s{font-size:clamp(13px,1.4vw,24px);color:var(--mute);margin-top:.3vh}
.lbar .clock{font-size:clamp(18px,2.4vw,40px)}
.lbar img{height:6vh;display:none}
#letterWrap{flex:1;overflow:auto;padding:1.5vh 1vw;position:relative}
#letterBox{margin:0 auto;overflow:hidden;background:#fff;box-shadow:0 6px 24px #10233b33}
#letterFrame{border:0;display:block;transform-origin:top left;background:#fff}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.4vw,40px);color:var(--mute)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="screen" id="screen">
<div id="queueView">

  <div class="sec top">
    <img id="logo" class="logo" alt="">
    <div>
      <div class="village" id="village">PEMERINTAH DESA</div>
      <div class="sub">INFORMASI PELAYANAN DESA</div>
    </div>
  </div>

  <div class="sec call" id="call">
    <div class="lbl" id="lbl">NOMOR ANTRIAN</div>
    <div class="queue" id="queue">--</div>
    <div class="go" id="go">SILAKAN KE</div>
    <div class="loket" id="loket">LOKET 1</div>
  </div>

  <div class="sec detail">
    <div class="k">SEDANG DILAYANI</div><div class="v" id="serving">:</div>
    <div class="k">PELAYANAN</div><div class="v" id="service">:</div>
    <div class="k" id="k3">LOKET</div><div class="v" id="v3">:</div>
  </div>

  <div class="sec info">
    <div class="h">INFORMASI</div>
    <div id="infoText"></div>
  </div>

  <div class="sec bottom">
    <div class="hours" id="hours"></div>
    <div class="clock" id="clock"></div>
  </div>
</div>

<div id="letterView">
  <div class="lbar">
    <div style="display:flex;align-items:center;gap:1.2vw">
      <img id="llogo" alt="">
      <div>
        <div class="t" id="ltitle">MOHON PERIKSA DOKUMEN ANDA</div>
        <div class="s" id="lsub"></div>
      </div>
    </div>
    <div class="clock" id="clock2"></div>
  </div>
  <div id="letterWrap">
    <div id="letterBox"><iframe id="letterFrame" sandbox="allow-same-origin" title="Pratinjau surat"></iframe></div>
    <div class="wait" id="lwait">Menyiapkan surat…</div>
  </div>
</div>
</div>

<script>
/* ===== PENGATURAN DEFAULT (ubah sesuai kebutuhan desa) ===== */
const DEFAULTS={
  loket:'1',
  info:'Harap menyiapkan KTP/KK untuk keperluan pelayanan.',
  hours:['Senin–Kamis 08.00–15.00','Jumat 08.00–11.00']
};
/* ========================================================== */

const KEY='DESA_SERVICE_DISPLAY_STATE';
const $=id=>document.getElementById(id);
const clean=v=>String(v??'').trim();
const stripVillage=v=>clean(v).replace(/^(pemerintah\s+)?(desa|kelurahan)\s+/i,'').trim();

function showQueue(p){
  p=p||{};
  const desa=stripVillage(p.village)||'DESA';
  $('village').textContent='PEMERINTAH DESA '+desa.toUpperCase();
  if(p.logo){$('logo').src=p.logo;$('logo').style.display='block'}

  const q=clean(p.queue);
  const nm=clean(p.name);
  const lk=clean(p.loket)||DEFAULTS.loket;

  // Blok tengah: pakai nomor antrian bila ada; bila belum, tampilkan nama pemohon
  if(q){
    $('lbl').textContent='NOMOR ANTRIAN';
    $('queue').textContent=q;$('queue').classList.remove('name');
    $('go').style.display='';$('loket').style.display='';
    $('loket').textContent='LOKET '+lk.toUpperCase();
  }else if(nm){
    $('lbl').textContent='SEDANG DILAYANI';
    $('queue').textContent=nm;$('queue').classList.add('name');
    $('go').style.display='none';$('loket').style.display='none';
  }else{
    $('lbl').textContent='SELAMAT DATANG';
    $('queue').textContent='--';$('queue').classList.remove('name');
    $('go').textContent='SILAKAN MENUNGGU';$('go').style.display='';
    $('loket').style.display='none';
  }
  if(q||nm)$('go').textContent='SILAKAN KE';

  // Detail
  $('serving').textContent=': '+(clean(p.serving)||nm||'-');
  $('service').textContent=': '+(clean(p.service)||'-');
  if(q){$('k3').textContent='LOKET';$('v3').textContent=': '+lk}
  else{
    const extra=clean(p.number)?['NOMOR SURAT',clean(p.number)]:clean(p.purpose)?['KEPERLUAN',clean(p.purpose)]:['LOKET',lk];
    $('k3').textContent=extra[0];$('v3').textContent=': '+extra[1];
  }

  $('infoText').textContent=clean(p.info)||DEFAULTS.info;

  const call=$('call');call.classList.remove('fade');void call.offsetWidth;call.classList.add('fade');
}

function renderHours(){
  $('hours').innerHTML='';
  DEFAULTS.hours.forEach(h=>{const s=document.createElement('span');s.textContent=h;$('hours').appendChild(s)});
}

/* ===== MODE CEK DOKUMEN (surat, biodata, F-1.01, KTP, akta, dll.) ===== */
const LETTER_KEY='DESA_SERVICE_DISPLAY_LETTER';
const MM=3.7795;
let lastDoc=null,lastKey='',zoom=1,dims=null,curPage=null,pausedUntil=0;

function getDoc(p){
  if(p.docHtml)return lastDoc={updatedAt:p.updatedAt,docHtml:p.docHtml};
  if(lastDoc&&lastDoc.updatedAt===p.updatedAt)return lastDoc;
  try{const l=JSON.parse(localStorage.getItem(LETTER_KEY)||'null');if(l&&l.docHtml&&l.updatedAt===p.updatedAt)return lastDoc=l}catch(e){}
  return null;
}
function showDoc(p){
  const desa=stripVillage(p.village);
  $('ltitle').textContent=clean(p.service)||'MOHON PERIKSA DOKUMEN ANDA';
  $('lsub').textContent=['Mohon periksa dokumen Anda',clean(p.name),desa?'Desa '+desa:''].filter(Boolean).join('  •  ');
  if(p.logo){$('llogo').src=p.logo;$('llogo').style.display='block'}
  const l=getDoc(p);
  const fr=$('letterFrame');
  if(!l){$('lwait').style.display='flex';return}
  $('lwait').style.display='none';
  curPage={w:(p.page&&p.page.w)||215.9,h:(p.page&&p.page.h)||330.2};
  zoom=1;dims=null;$('letterWrap').scrollTop=0;
  fr.style.width=Math.round(curPage.w*MM)+'px';fr.style.height=Math.round(curPage.h*MM)+'px';fr.style.transform='none';
  fr.onload=()=>{measure();setTimeout(measure,400);setTimeout(measure,1200)};
  fr.srcdoc=l.docHtml.replace(/<\/head>/i,'<style>html,body{overflow:hidden!important}</style></head>');
}
function measure(){
  try{
    const fr=$('letterFrame'),d=fr.contentDocument;
    const pw=Math.round(curPage.w*MM),ph=Math.round(curPage.h*MM);
    const bb=d.body.getBoundingClientRect();
    let kb=0,kr=0;Array.from(d.body.children).forEach(c=>{const r=c.getBoundingClientRect();kb=Math.max(kb,r.bottom);kr=Math.max(kr,r.right)});
    // catatan: scrollHeight html tidak dipakai karena selalu >= tinggi iframe
    const cw=Math.max(pw,Math.ceil(kr),Math.ceil(bb.width));
    const ch=Math.max(200,Math.ceil(kb),Math.ceil(bb.height));
    dims={w:cw,h:ch,pageH:ph};
    fit();
  }catch(e){}
}
function fit(){
  if(!dims)return;
  const wrap=$('letterWrap'),fr=$('letterFrame'),box=$('letterBox');
  const cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  // satu halaman: muat seluruhnya; banyak halaman: sesuaikan lebar/tinggi 1 halaman lalu gulir otomatis
  const multi=dims.h>dims.pageH*1.12;
  const refH=multi?dims.pageH:dims.h;
  const sc=Math.min(aw/dims.w,ah/refH)*zoom;
  fr.style.width=dims.w+'px';
  fr.style.height=dims.h+'px';
  fr.style.transform='scale('+sc+')';
  box.style.width=Math.floor(dims.w*sc)+'px';
  box.style.height=Math.floor(dims.h*sc)+'px';
}
// Zoom oleh petugas: + / - / 0 (layar ke-2 ada di komputer yang sama)
window.addEventListener('keydown',e=>{
  if(!$('screen').classList.contains('letter'))return;
  pausedUntil=Date.now()+25000;
  if(e.key==='+'||e.key==='='){zoom=Math.min(zoom*1.15,4);fit()}
  else if(e.key==='-'||e.key==='_'){zoom=Math.max(zoom/1.15,.3);fit()}
  else if(e.key==='0'){zoom=1;fit()}
});
['wheel','touchstart','mousedown'].forEach(ev=>$('letterWrap').addEventListener(ev,()=>{pausedUntil=Date.now()+25000},{passive:true}));
// Dokumen banyak halaman (mis. KTP beberapa anggota, F-1.01): gulir otomatis per layar agar warga bisa memeriksa semuanya
setInterval(()=>{
  if(!$('screen').classList.contains('letter')||Date.now()<pausedUntil)return;
  const w=$('letterWrap');
  if(w.scrollHeight<=w.clientHeight+20)return;
  const atEnd=w.scrollTop+w.clientHeight>=w.scrollHeight-4;
  w.scrollTo({top:atEnd?0:w.scrollTop+w.clientHeight*0.9,behavior:'smooth'});
},8000);
window.addEventListener('resize',fit);

/* ===== PENGATUR TAMPILAN ===== */
function showState(p){
  p=p||{};
  const isDoc=p.mode==='doc'||p.mode==='letter';
  const key=[p.updatedAt||'',p.mode||'',p.docHtml?'H':'-'].join('|');
  if(key===lastKey)return;               // abaikan kiriman ganda (BroadcastChannel + postMessage + storage)
  lastKey=key;
  const scr=$('screen');
  if(isDoc){scr.classList.add('letter');showDoc(p)}
  else{scr.classList.remove('letter');showQueue(p)}
}

function decodeHashPayload(){
  try{
    const m=location.hash.match(/^#service=(.+)$/);
    if(!m)return null;
    return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
  }catch(e){return null}
}
function load(){
  const h=decodeHashPayload();
  if(h){showState(h);try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}return}
  try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p){showState(p);return}}catch(e){}
  showState({});
}
function clock(){
  const d=new Date();
  const t=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(/\./g,':');
  $('clock').textContent=t;$('clock2').textContent=t;
}

renderHours();load();clock();setInterval(clock,1000);
try{const bc=new BroadcastChannel('DESA_SERVICE_DISPLAY');bc.onmessage=e=>{if(e.data?.type==='SHOW_SERVICE')showState(e.data.payload)}}catch(e){}
window.addEventListener('message',e=>{
  if(e.data?.type!=='SHOW_SERVICE')return;
  if(e.source===window.opener||e.origin===location.origin)showState(e.data.payload);
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{showState(JSON.parse(e.newValue))}catch(err){}}});
window.addEventListener('hashchange',load);
</script>
</body>
</html>
