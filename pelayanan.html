<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelayanan & Administrasi Desa</title>
<link id="appFavicon" rel="icon" href="">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}
button,input,select,textarea{font:inherit}.app{min-height:100vh}.top{height:62px;background:#fff;border-bottom:1px solid #dce3ec;display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}
.logo{width:38px;height:38px;object-fit:contain;border-radius:8px;display:none}.brand{font-size:18px;font-weight:800}.sub{font-size:11px;color:#667085}.account{margin-left:auto;font-size:13px;color:#475467}
.layout{display:flex;min-height:calc(100vh - 62px)}.side{width:245px;background:#172033;color:#fff;padding:14px 10px}.side h3{font-size:11px;letter-spacing:.08em;color:#98a2b3;margin:12px 10px 7px}.nav{width:100%;border:0;background:transparent;color:#e6eaf0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:#2d3a52;color:#fff}.main{flex:1;padding:22px;max-width:1450px}.page-title{font-size:24px;font-weight:800;margin:0 0 4px}.page-desc{color:#667085;margin-bottom:18px}.panel{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700}.input,.select,textarea{width:100%;margin-top:6px;border:1px solid #cfd7e3;border-radius:8px;padding:9px 10px;background:#fff}.input:focus,.select:focus,textarea:focus{outline:2px solid #dbe7ff;border-color:#6b8de3}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.btn.dark{background:#172033;color:#fff;border-color:#172033}.btn.danger{background:#fff1f2;color:#b42318;border-color:#fecdd3}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hint{font-size:12px;color:#667085}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:16px}.stat b{display:block;font-size:25px;margin-top:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.toolbar>label{min-width:180px}.table-wrap{overflow:auto;border:1px solid #e1e7ef;border-radius:10px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px;white-space:nowrap}th{background:#f8fafc;font-weight:800}td.wrap{white-space:normal}.empty{text-align:center;padding:30px;color:#667085}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3446a3;font-size:11px;font-weight:700}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.open{display:flex}.modal-box{background:#fff;border-radius:14px;width:min(920px,100%);max-height:92vh;overflow:auto}.modal-head{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px}.modal-foot{padding:14px 18px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}.x{border:0;background:transparent;font-size:22px;cursor:pointer}.resident-result{border:1px solid #d8e0eb;border-radius:9px;margin-top:6px;max-height:230px;overflow:auto}.resident-item{padding:9px 10px;border-bottom:1px solid #edf0f4;cursor:pointer}.resident-item:hover{background:#f5f8ff}.selected-person{background:#f5f8ff;border:1px solid #c8d7f4;border-radius:10px;padding:12px;margin-top:8px}.print-area{display:none}
@media(max-width:900px){.side{width:205px}.grid,.grid3,.stats{grid-template-columns:1fr}.main{padding:14px}}
@media print{body{background:#fff}.top,.side,.main{display:none!important}.print-area{display:block}}
</style>
<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header class="top">
<img id="logo" class="logo" alt="">
<div><div class="brand" id="brand">Pelayanan & Administrasi Desa</div><div class="sub" id="villageSub">Menggunakan data penduduk desa</div></div>
<div class="account" id="account">-</div>
</header>
<div class="layout">
<aside class="side">
<h3>PELAYANAN</h3>
<button class="nav active" data-page="dashboard">📊 Dashboard Pelayanan</button>
<button class="nav" data-page="create">📝 Buat Pelayanan</button>
<button class="nav" data-page="register">📚 Register Pelayanan</button>
<button class="nav" data-page="archive">🗂️ Arsip Surat</button>
<h3>LAPORAN</h3>
<button class="nav" data-page="report">📈 Laporan Pelayanan</button>
<h3>PENGATURAN</h3>
<button class="nav" data-page="about">⚙️ Informasi Sistem</button>
</aside>
<main class="main">
<section id="page-dashboard"></section>
<section id="page-create" style="display:none"></section>
<section id="page-register" style="display:none"></section>
<section id="page-archive" style="display:none"></section>
<section id="page-report" style="display:none"></section>
<section id="page-about" style="display:none"></section>
</main>
</div>
</div>

<div class="modal" id="personModal">
<div class="modal-box">
<div class="modal-head"><b>Pilih Penduduk</b><button class="x" data-close="personModal">×</button></div>
<div class="modal-body">
<label>Cari NIK / Nama / No. KK
<input class="input" id="personSearch" placeholder="Ketik minimal 2 karakter">
</label>
<div id="personResults" class="resident-result"></div>
</div>
</div>
</div>

<div class="modal" id="detailModal">
<div class="modal-box">
<div class="modal-head"><b>Detail Pelayanan</b><button class="x" data-close="detailModal">×</button></div>
<div class="modal-body" id="detailBody"></div>
<div class="modal-foot"><button class="btn" data-close="detailModal">Tutup</button><button class="btn primary" id="btnDetailPrint">Cetak Surat</button></div>
</div>
</div>

<div class="print-area" id="printArea"></div>

<script>
(function(){
'use strict';
const SERVICE_KEY='pelayananAdministrasiDesa_v1';
let residents=[], settings={}, selectedResident=null, editingId=null, detailRecord=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const upper=v=>String(v??'').trim().toUpperCase();
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=v=>{if(!v)return '-';const d=new Date(v+'T00:00:00');return isNaN(d)?String(v):d.toLocaleDateString('id-ID')};
const active=r=>String(r?.STATUS_AKTIF||'AKTIF').toUpperCase()!=='TIDAK AKTIF';
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(SERVICE_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveLocal(x){localStorage.setItem(SERVICE_KEY,JSON.stringify(x))}
function services(){return loadLocal()}
function activeResidents(){return residents.filter(active)}
function serviceTypes(){return ['Surat Keterangan Domisili','Surat Keterangan Usaha','Surat Keterangan Tidak Mampu','Surat Keterangan Belum Menikah','Surat Keterangan Beda Nama','Surat Keterangan Ahli Waris','Surat Keterangan Kehilangan','Surat Keterangan Kebakaran','Surat Keterangan Tanah/Bangunan','Surat Keterangan Serba Guna','Surat Keterangan Penghasilan','Surat Keterangan Berada di Luar Kota','Surat Keterangan Janda/Duda','Surat Kuasa','Surat Pengantar/Umum']}
function villageName(){return String(settings.village||'').replace(/^desa\s+/i,'').trim()||'Desa'}
function renderShell(){
 $('brand').textContent='Pelayanan & Administrasi '+villageName();
 $('villageSub').textContent='Sistem pelayanan desa • menggunakan database penduduk yang sama';
 $('account').textContent=window.currentUser?.email||'Mode lokal';
 if(settings.logo){$('logo').src=settings.logo;$('logo').style.display='block'} else $('logo').style.display='none';
}
async function loadCloud(){
 if(!window.supabase||!window.SUPABASE_CONFIG?.url||window.SUPABASE_CONFIG.url.includes('YOUR_')) return;
 window.sb=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);
 const {data:{session}}=await window.sb.auth.getSession();
 if(session) window.currentUser=session.user;
 try{
  const s=await window.sb.from('app_settings').select('settings').eq('id','main').maybeSingle();
  if(s.data?.settings) settings=s.data.settings;
 }catch(e){console.warn(e)}
 if(window.currentUser){
  try{
   const r=await window.sb.from('residents').select('nik,data').order('nik');
   if(!r.error) residents=(r.data||[]).map(x=>x.data||{});
  }catch(e){console.warn(e)}
 }
}
function showPage(name){
 ['dashboard','create','register','archive','report','about'].forEach(x=>$('page-'+x).style.display=x===name?'block':'none');
 document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===name));
 if(name==='dashboard')renderDashboard();
 if(name==='create')renderCreate();
 if(name==='register')renderRegister();
 if(name==='archive')renderArchive();
 if(name==='report')renderReport();
 if(name==='about')renderAbout();
}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).classList.remove('open')));
function openPersonModal(){
 $('personSearch').value='';$('personResults').innerHTML='<div class="empty">Ketik NIK, nama atau No. KK.</div>';
 $('personModal').classList.add('open');setTimeout(()=>$('personSearch').focus(),50);
}
$('personSearch').addEventListener('input',()=>{
 const q=upper($('personSearch').value);
 if(q.length<2){$('personResults').innerHTML='<div class="empty">Ketik minimal 2 karakter.</div>';return}
 const rows=activeResidents().filter(r=>[r.NIK,r['NAMA LENGKAP'],r['NO KK']].some(v=>upper(v).includes(q))).slice(0,80);
 $('personResults').innerHTML=rows.length?rows.map(r=>`<div class="resident-item" data-nik="${esc(r.NIK)}"><b>${esc(r['NAMA LENGKAP']||'-')}</b><br><span class="hint">NIK ${esc(r.NIK||'-')} • KK ${esc(r['NO KK']||'-')} • ${esc(r.ALAMAT||'')}</span></div>`).join(''):'<div class="empty">Penduduk aktif tidak ditemukan.</div>';
});
$('personResults').addEventListener('click',e=>{
 const item=e.target.closest('.resident-item');if(!item)return;
 selectedResident=activeResidents().find(r=>String(r.NIK)===String(item.dataset.nik))||null;
 $('personModal').classList.remove('open');renderCreate();
});
function personCard(){
 if(!selectedResident)return '<div class="hint">Belum ada penduduk dipilih.</div>';
 const r=selectedResident;
 return `<div class="selected-person"><b>${esc(r['NAMA LENGKAP'])}</b><br>NIK: ${esc(r.NIK)} • No. KK: ${esc(r['NO KK'])}<br>Alamat: ${esc(r.ALAMAT||'-')}, RT ${esc(r.RT||'-')} / RW ${esc(r.RW||'-')}, ${esc(villageName())}</div>`;
}
function renderCreate(){
 const opts=serviceTypes().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 $('page-create').innerHTML=`<h1 class="page-title">Buat Pelayanan</h1><div class="page-desc">Pilih penduduk dari database kependudukan, lalu buat dokumen pelayanan.</div>
 <div class="panel"><div class="actions"><button class="btn primary" id="choosePerson">🔎 Pilih Penduduk</button>${selectedResident?'<button class="btn" id="clearPerson">Ganti Penduduk</button>':''}</div>${personCard()}</div>
 <div class="panel"><div class="grid"><label>Jenis Pelayanan<select class="select" id="serviceType">${opts}</select></label><label>Tanggal Pelayanan<input class="input" id="serviceDate" type="date" value="${today()}"></label><label>Nomor Surat<input class="input" id="serviceNumber" placeholder="Nomor surat"></label><label>Keperluan<input class="input" id="servicePurpose" placeholder="Keperluan pelayanan"></label><label class="full">Keterangan Tambahan<textarea id="serviceNote" rows="4" placeholder="Keterangan bila diperlukan"></textarea></label></div>
 <div class="hint" style="margin-top:10px">Data biodata dasar diambil otomatis dari penduduk aktif. Data penduduk tidak aktif tidak dapat dipilih untuk pelayanan baru.</div>
 <div class="actions"><button class="btn primary" id="saveService">💾 Simpan Pelayanan</button><button class="btn" id="resetService">Reset</button></div></div>`;
 $('choosePerson').onclick=openPersonModal;
 if($('clearPerson'))$('clearPerson').onclick=()=>{selectedResident=null;renderCreate()};
 $('saveService').onclick=saveService;
 $('resetService').onclick=()=>{selectedResident=null;renderCreate()};
}
function saveService(){
 if(!selectedResident)return alert('Pilih penduduk terlebih dahulu.');
 const type=$('serviceType').value,date=$('serviceDate').value,number=$('serviceNumber').value.trim();
 if(!date||!type)return alert('Jenis pelayanan dan tanggal wajib diisi.');
 const rec={id:crypto.randomUUID(),created_at:new Date().toISOString(),date,type,number,nik:selectedResident.NIK,name:selectedResident['NAMA LENGKAP'],kk:selectedResident['NO KK'],purpose:$('servicePurpose').value.trim(),note:$('serviceNote').value.trim(),resident:{...selectedResident},status:'SELESAI'};
 const rows=services();rows.unshift(rec);saveLocal(rows);
 alert('Pelayanan berhasil disimpan.');
 detailRecord=rec;selectedResident=null;showPage('register');
}
function renderDashboard(){
 const rows=services(),month=today().slice(0,7),monthly=rows.filter(x=>String(x.date).slice(0,7)===month);
 const counts={};rows.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('page-dashboard').innerHTML=`<h1 class="page-title">Dashboard Pelayanan Desa</h1><div class="page-desc">Ringkasan pelayanan dan administrasi desa.</div>
 <div class="stats"><div class="stat">Total Pelayanan<b>${rows.length}</b></div><div class="stat">Bulan Berjalan<b>${monthly.length}</b></div><div class="stat">Penduduk Aktif<b>${activeResidents().length}</b></div><div class="stat">Jenis Pelayanan<b>${Object.keys(counts).length}</b></div></div>
 <div class="panel" style="margin-top:16px"><h3>Pelayanan Terbanyak</h3>${top.length?'<div class="table-wrap"><table><thead><tr><th>Jenis Pelayanan</th><th>Jumlah</th></tr></thead><tbody>'+top.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Belum ada pelayanan tersimpan.</div>'}</div>`;
}
function renderRegister(){
 const rows=services();
 $('page-register').innerHTML=`<h1 class="page-title">Register Pelayanan</h1><div class="page-desc">Seluruh pelayanan yang telah dibuat dari aplikasi ini.</div>
 <div class="panel"><div class="toolbar"><label>Pencarian<input class="input" id="regSearch" placeholder="NIK / nama / nomor surat"></label><label>Jenis<select class="select" id="regType"><option value="">Semua jenis</option>${serviceTypes().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Tanggal<input class="input" id="regDate" type="date"></label><button class="btn" id="regRefresh">↻ Segarkan</button></div></div>
 <div class="panel"><div class="table-wrap"><table><thead><tr><th>No</th><th>Tanggal</th><th>Nomor</th><th>Jenis</th><th>NIK</th><th>Nama</th><th>Keperluan</th><th>Aksi</th></tr></thead><tbody id="regBody"></tbody></table></div></div>`;
 const draw=()=>{
  const q=upper($('regSearch').value),t=$('regType').value,d=$('regDate').value;
  const f=rows.filter(x=>(!q||[x.number,x.nik,x.name,x.purpose].some(v=>upper(v).includes(q)))&&(!t||x.type===t)&&(!d||x.date===d));
  $('regBody').innerHTML=f.length?f.map((x,i)=>`<tr><td>${i+1}</td><td>${fmtDate(x.date)}</td><td>${esc(x.number||'-')}</td><td><span class="badge">${esc(x.type)}</span></td><td>${esc(x.nik)}</td><td>${esc(x.name)}</td><td class="wrap">${esc(x.purpose||'-')}</td><td><button class="btn" data-detail="${esc(x.id)}">Detail</button> <button class="btn" data-print="${esc(x.id)}">Cetak</button> <button class="btn danger" data-del="${esc(x.id)}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada data pelayanan.</td></tr>';
 };
 ['regSearch','regType','regDate'].forEach(id=>$(id).addEventListener('input',draw));$('regRefresh').onclick=draw;
 $('regBody').addEventListener('click',e=>{
  const d=e.target.closest('[data-detail]'),p=e.target.closest('[data-print]'),del=e.target.closest('[data-del]');
  if(d){detailRecord=rows.find(x=>x.id===d.dataset.detail);openDetail(detailRecord)}
  if(p){const x=rows.find(x=>x.id===p.dataset.print);printService(x)}
  if(del){const x=rows.find(x=>x.id===del.dataset.del);if(x&&confirm('Hapus catatan pelayanan ini? Data penduduk tidak akan dihapus.')){saveLocal(rows.filter(y=>y.id!==x.id));renderRegister()}}
 });
 draw();
}
function renderArchive(){
 const rows=services();
 $('page-archive').innerHTML=`<h1 class="page-title">Arsip Surat</h1><div class="page-desc">Arsip dokumen pelayanan yang tersimpan.</div><div class="panel"><div class="hint">Arsip pada tahap awal ini menggunakan register pelayanan sebagai sumber arsip. Setiap dokumen dapat dicetak ulang berdasarkan data yang tersimpan.</div><div class="actions"><button class="btn primary" id="goRegister">Buka Register Pelayanan</button></div></div><div class="panel"><div class="stats"><div class="stat">Dokumen Tersimpan<b>${rows.length}</b></div><div class="stat">Tahun Ini<b>${rows.filter(x=>String(x.date).slice(0,4)===String(new Date().getFullYear())).length}</b></div><div class="stat">Dengan Nomor Surat<b>${rows.filter(x=>x.number).length}</b></div><div class="stat">Tanpa Nomor<b>${rows.filter(x=>!x.number).length}</b></div></div></div>`;
 $('goRegister').onclick=()=>showPage('register');
}
function renderReport(){
 const rows=services(),byMonth={};rows.forEach(x=>{const k=String(x.date||'').slice(0,7);byMonth[k]=(byMonth[k]||0)+1});
 $('page-report').innerHTML=`<h1 class="page-title">Laporan Pelayanan</h1><div class="page-desc">Rekap pelayanan berdasarkan periode dan jenis.</div><div class="panel"><div class="grid3"><label>Dari<input class="input" id="repFrom" type="date"></label><label>Sampai<input class="input" id="repTo" type="date"></label><label>Jenis<select class="select" id="repType"><option value="">Semua jenis</option>${serviceTypes().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label></div><div class="actions"><button class="btn primary" id="repRun">Tampilkan</button><button class="btn" id="repPrint">Cetak Rekap</button></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Bulan</th><th>Jumlah Pelayanan</th></tr></thead><tbody id="repBody">${Object.entries(byMonth).sort().reverse().map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Belum ada data.</td></tr>'}</tbody></table></div></div>`;
 const get=()=>rows.filter(x=>(!$('repFrom').value||x.date>=$('repFrom').value)&&(!$('repTo').value||x.date<=$('repTo').value)&&(!$('repType').value||x.type===$('repType').value));
 $('repRun').onclick=()=>{$('repBody').innerHTML=Object.entries(get().reduce((a,x)=>{const k=x.date.slice(0,7);a[k]=(a[k]||0)+1;return a},{})).sort().reverse().map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Tidak ada data.</td></tr>'};
 $('repPrint').onclick=()=>printReport(get());
}
function renderAbout(){
 $('page-about').innerHTML=`<h1 class="page-title">Informasi Sistem</h1><div class="page-desc">Tahap 2 — Pelayanan & Administrasi Desa</div><div class="panel"><h3>Prinsip integrasi</h3><ul><li>Data penduduk dibaca dari tabel <b>residents</b> aplikasi kependudukan.</li><li>Hanya penduduk aktif yang dapat dipilih untuk pelayanan baru.</li><li>Data penduduk tidak disalin ke database kedua.</li><li>Identitas desa membaca pengaturan dari <b>app_settings</b>.</li><li>Register pelayanan tahap awal disimpan terpisah agar tidak mengubah data kependudukan.</li></ul><div class="hint">Struktur ini sengaja dipisahkan dari aplikasi kependudukan sehingga pengembangan pelayanan tidak mengganggu modul kependudukan.</div></div>`;
}
function openDetail(x){
 if(!x)return;
 $('detailBody').innerHTML=`<div class="grid"><div><b>Jenis Pelayanan</b><div>${esc(x.type)}</div></div><div><b>Tanggal</b><div>${fmtDate(x.date)}</div></div><div><b>Nomor Surat</b><div>${esc(x.number||'-')}</div></div><div><b>Status</b><div><span class="badge">${esc(x.status||'SELESAI')}</span></div></div><div><b>NIK</b><div>${esc(x.nik)}</div></div><div><b>Nama</b><div>${esc(x.name)}</div></div><div><b>No. KK</b><div>${esc(x.kk)}</div></div><div><b>Keperluan</b><div>${esc(x.purpose||'-')}</div></div><div class="full"><b>Keterangan</b><div>${esc(x.note||'-')}</div></div></div>`;
 $('detailModal').classList.add('open');
}
$('btnDetailPrint').onclick=()=>{if(detailRecord)printService(detailRecord)};
function letterHtml(x){
 const r=x.resident||{},desa=villageName(),kec=settings.district||'',kab=settings.regency||'',date=fmtDate(x.date);
 return `<div style="font-family:Arial,sans-serif;width:190mm;min-height:270mm;margin:auto;font-size:12pt;line-height:1.45">
 <div style="text-align:center;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:20px">${settings.logo?`<img src="${esc(settings.logo)}" style="width:55px;height:55px;object-fit:contain;float:left">`:''}<b style="font-size:15pt">PEMERINTAH DAERAH KABUPATEN ${esc(upper(kab))}</b><br><b style="font-size:14pt">KECAMATAN ${esc(upper(kec))}</b><br><b style="font-size:16pt">DESA ${esc(upper(desa))}</b>${settings.officeAddress?`<br><span style="font-size:9pt">${esc(settings.officeAddress)}</span>`:''}</div>
 <div style="text-align:center"><b><u>${esc(x.type).toUpperCase()}</u></b><br>Nomor : ${esc(x.number||'................................')}</div>

function printService(x){
 if(!x)return;
 $('printArea').innerHTML=letterHtml(x);
 document.body.classList.add('printing');
 setTimeout(()=>{window.print();document.body.classList.remove('printing')},50);
}
function printReport(rows){
 const groups={};rows.forEach(x=>groups[x.type]=(groups[x.type]||0)+1);
 $('printArea').innerHTML=`<div style="font-family:Arial;width:190mm;margin:auto"><h2 style="text-align:center">REKAP PELAYANAN DESA ${esc(upper(villageName()))}</h2><table style="width:100%;border-collapse:collapse" border="1"><thead><tr><th>No</th><th>Jenis Pelayanan</th><th>Jumlah</th></tr></thead><tbody>${Object.entries(groups).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')||'<tr><td colspan="3">Tidak ada data.</td></tr>'}</tbody></table></div>`;
 setTimeout(()=>window.print(),50);
}

 await loadCloud();renderShell();renderDashboard();showPage('dashboard');

boot();
