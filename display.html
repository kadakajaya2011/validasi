<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layar 2 - Data Kependudukan Desa</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#eef2f6;color:#17212f}
#summary{height:100%;display:flex;align-items:center;justify-content:center;padding:30px}
.card{width:min(900px,94vw);background:#fff;border:1px solid #d9e1ea;border-radius:16px;padding:40px;box-shadow:0 15px 45px rgba(15,42,77,.15);text-align:center}
.logo{width:75px;height:75px;object-fit:contain;margin-bottom:15px}
.village{font-size:22px;font-weight:800;text-transform:uppercase}
.caption{font-size:14px;color:#66758a;margin:8px 0 30px}
.name{font-size:42px;font-weight:800;text-transform:uppercase;word-break:break-word;margin:15px 0}
.service{font-size:25px;font-weight:700;margin:10px 0 28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;border-top:1px solid #d9e1ea;padding-top:20px}
.grid>div{background:#f7f9fb;border-radius:9px;padding:12px 14px}
.grid b{display:block;color:#66758a;font-size:12px;margin-bottom:5px}.grid span{font-size:16px}
#document{display:none;width:100%;height:100%;overflow:auto;background:#dfe5eb;padding:22px}
#documentFrame{width:100%;min-height:100%;border:0;background:#fff}
#hint{position:fixed;right:12px;bottom:10px;background:#102a4c;color:#fff;border-radius:8px;padding:7px 10px;font-size:11px;opacity:.7}
@media(max-width:650px){.card{padding:25px 18px}.name{font-size:30px}.service{font-size:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="summary">
  <section class="card">
    <div id="village" class="village">PEMERINTAH DESA</div>
    <div class="caption">Menunggu hasil cetakan dari aplikasi petugas...</div>
    <div id="name" class="name">BELUM ADA DOKUMEN</div>
    <div id="service" class="service">Layar 2 Pelayanan Desa</div>
    <div class="grid">
      <div><b>NIK</b><span id="nik">-</span></div>
      <div><b>NO. KK</b><span id="kk">-</span></div>
      <div><b>STATUS</b><span id="status">Menunggu</span></div>
      <div><b>WAKTU</b><span id="time">-</span></div>
    </div>
  </section>
</div>
<div id="document"><iframe id="documentFrame" title="Hasil cetakan"></iframe></div>
<div id="hint">Layar 2 • terhubung</div>

<script>
const CHANNEL='dataKependudukanDesa_layar2_v1';
const STORAGE='dataKependudukanDesa_layar2_v1';
let channel=null;
try{
  channel=new BroadcastChannel(CHANNEL);
  channel.onmessage=e=>handlePayload(e.data||{});
}catch(e){}

window.addEventListener('storage',e=>{
  if(e.key!==STORAGE||!e.newValue)return;
  try{handlePayload(JSON.parse(e.newValue))}catch(err){}
});

function escText(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cleanIncomingHtml(html){
  let x=String(html||'');
  x=x.replace(/<script[\\s\\S]*?<\\/script>/gi,'');
  x=x.replace(/\\son[a-z]+\\s*=\\s*(".*?"|'.*?'|[^\\s>]+)/gi,'');
  return x;
}
function renderSummary(p){
  document.getElementById('name').textContent=p.nama||'DOKUMEN';
  document.getElementById('nik').textContent=p.nik||'-';
  document.getElementById('kk').textContent=p.kk||'-';
  document.getElementById('service').textContent=p.pelayanan||p.title||'PELAYANAN';
  document.getElementById('status').textContent=p.status||'DOKUMEN SIAP';
  document.getElementById('village').textContent=p.desa||'PEMERINTAH DESA';
  document.getElementById('time').textContent=p.updatedAt?new Date(p.updatedAt).toLocaleString('id-ID'):new Date().toLocaleString('id-ID');
}
function renderDocument(p){
  const html=cleanIncomingHtml(p.html);
  if(!html){document.getElementById('document').style.display='none';document.getElementById('summary').style.display='flex';return}
  const css=String(p.css||'');
  const frame=document.getElementById('documentFrame');
  const doc='<!doctype html><html><head><meta charset="utf-8"><style>'+css+'\
body{margin:0!important;padding:0!important;background:#fff!important;overflow:auto!important}\
</style></head><body>'+html+'</body></html>';
  frame.srcdoc=doc;
  document.getElementById('summary').style.display='none';
  document.getElementById('document').style.display='block';
}
function handlePayload(p){
  if(!p||p.type!=='DISPLAY')return;
  renderSummary(p);
  renderDocument(p);
  try{localStorage.setItem(STORAGE,JSON.stringify(p))}catch(e){}
}
(function(){
  try{
    const p=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(p)handlePayload(p);
  }catch(e){}
})();
</script>
</body>
</html>
