<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layar 2 - Pelayanan Desa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.display{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.paper{width:min(900px,94vw);background:white;border:1px solid #d9dee5;border-radius:14px;padding:42px 48px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 18px}
.village{text-align:center;font-size:22px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.title{text-align:center;font-size:30px;margin:0 0 28px}.status{text-align:center;font-size:16px;color:#6b7280;margin-bottom:28px}
.name{text-align:center;font-size:42px;font-weight:800;margin:14px 0;text-transform:uppercase;word-break:break-word}
.service{text-align:center;font-size:25px;font-weight:600;margin:10px 0 30px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid #d9dee5;padding-top:20px}
.meta div{padding:13px 15px;background:#f8fafc;border-radius:9px}.meta b{display:block;font-size:13px;color:#6b7280;margin-bottom:5px}
.meta span{font-size:17px}.empty{text-align:center;color:#6b7280;font-size:20px;padding:80px 10px}
.operator{max-width:900px;margin:30px auto;padding:25px;background:#fff;border:1px solid #d9dee5;border-radius:12px}
.operator h2{margin-top:0}.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:#0b57d0;color:white;font-weight:600}
button.secondary{background:#6b7280}textarea{width:100%;min-height:150px;margin:12px 0;padding:12px;border:1px solid #d9dee5;border-radius:8px;font-family:monospace}
.hint{color:#6b7280;font-size:14px;line-height:1.5}body.display-only .operator{display:none}
@media(max-width:650px){.display{padding:15px}.paper{padding:28px 20px}.name{font-size:30px}.service{font-size:20px}.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="display"><section class="paper">
<img id="logo" class="logo" style="display:none" alt="Logo Desa">
<div id="village" class="village">PEMERINTAH DESA</div>
<h1 class="title">LAYAR PELAYANAN</h1>
<div id="status" class="status">Menunggu data dari aplikasi petugas...</div>
<div id="empty" class="empty">Belum ada dokumen yang ditampilkan.</div>
<div id="content" style="display:none">
<div id="name" class="name">-</div><div id="service" class="service">-</div>
<div class="meta">
<div><b>NIK</b><span id="nik">-</span></div><div><b>NO. KK</b><span id="kk">-</span></div>
<div><b>STATUS</b><span id="docStatus">-</span></div><div><b>WAKTU</b><span id="time">-</span></div>
</div></div></section></div>

<div class="operator" id="operatorPanel">
<h2>Pengujian Layar 2</h2>
<p class="hint">Panel ini hanya untuk pengujian Tahap 1. Nanti aplikasi kependudukan akan mengirim data secara otomatis.</p>
<textarea id="jsonInput">{
  "nama": "CONTOH NAMA PENDUDUK",
  "nik": "3211000000000001",
  "kk": "3211000000000002",
  "pelayanan": "SURAT KETERANGAN DOMISILI",
  "status": "SILAKAN MENUNGGU",
  "desa": "DESA KADAKAJAYA"
}</textarea>
<div class="buttons">
<button onclick="sendTest()">Tampilkan di Layar</button>
<button class="secondary" onclick="clearDisplay()">Kosongkan Layar</button>
<button class="secondary" onclick="openDisplayMode()">Buka Mode Layar 2</button>
</div></div>

<script>
const STORAGE_KEY='dataKependudukanDesa_layar2_v1'; let channel=null;
try{channel=new BroadcastChannel('dataKependudukanDesa_layar2_v1');channel.onmessage=e=>{if(e.data?.type==='DISPLAY')render(e.data.payload||{});if(e.data?.type==='CLEAR')clearScreen()}}catch(e){}
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){try{render(e.newValue?JSON.parse(e.newValue):{})}catch(err){}}});
function sendToDisplay(data){data.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(data));if(channel)channel.postMessage({type:'DISPLAY',payload:data});render(data)}
function sendTest(){try{sendToDisplay(JSON.parse(document.getElementById('jsonInput').value))}catch(e){alert('Data pengujian tidak valid. Pastikan format JSON benar.')}}
function clearDisplay(){localStorage.removeItem(STORAGE_KEY);if(channel)channel.postMessage({type:'CLEAR'});clearScreen()}
function clearScreen(){content.style.display='none';empty.style.display='block';status.textContent='Menunggu data dari aplikasi petugas...'}
function render(data){if(!data||(!data.nama&&!data.pelayanan)){clearScreen();return}empty.style.display='none';content.style.display='block';name.textContent=data.nama||'-';nik.textContent=data.nik||'-';kk.textContent=data.kk||'-';service.textContent=data.pelayanan||'PELAYANAN';docStatus.textContent=data.status||'DOKUMEN SIAP';village.textContent=data.desa||'PEMERINTAH DESA';time.textContent=data.updatedAt?new Date(data.updatedAt).toLocaleString('id-ID'):new Date().toLocaleString('id-ID');status.textContent='Data pelayanan diterima dari aplikasi petugas'}
function openDisplayMode(){window.open(location.pathname+'?mode=display','Layar2Desa','width=1200,height=800')}
(function(){if(new URLSearchParams(location.search).get('mode')==='display')document.body.classList.add('display-only');const s=localStorage.getItem(STORAGE_KEY);if(s)try{render(JSON.parse(s))}catch(e){}})();
</script>
</body></html>
